name: E2E Tests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: News_summary_helper

    steps:
      # docker-compose.e2e.yml 用相對路徑掛載前端，所以兩個 repo 要放在同一層
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: News_summary_helper

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: aryhsg/News_summary_helper_frontend
          ref: nsh_local
          path: News_summary_helper_frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            News_summary_helper/requirements.txt
            News_summary_helper/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('News_summary_helper/requirements-dev.txt') }}

      # 瀏覽器有快取時不會重新下載，但系統套件每次都是全新機器，仍要安裝
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # config.js 不進前端版控，先建立掛載點，內容由測試專用的 config.js 覆蓋
      - name: Start test stack
        run: |
          touch ../News_summary_helper_frontend/config.js
          docker compose -f tests/e2e/docker-compose.e2e.yml up -d --build --wait

      - name: Run E2E tests
        run: pytest tests/e2e -v -ra --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results

      - name: Save container logs
        if: failure()
        run: |
          mkdir -p test-results
          docker compose -f tests/e2e/docker-compose.e2e.yml logs --no-color > test-results/containers.log

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: News_summary_helper/test-results
          retention-days: 7

      - name: Stop test stack
        if: always()
        run: docker compose -f tests/e2e/docker-compose.e2e.yml down -v
