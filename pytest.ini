[pytest]
pythonpath = . line_bot
# 順便把之前權限報錯的資料夾過濾掉
#
# tests/e2e 是 Playwright 前端測試，需要先起 tests/e2e/docker-compose.e2e.yml，
# 而且 Playwright 的同步 API 會在行程裡留下事件迴圈，跟 pytest-asyncio 的測試
# 放在同一次執行會互相干擾。所以預設的 `pytest` 不進去收集，要跑時明確指定：
#   pytest tests/e2e
norecursedirs = infrastructure/news_database/postgres_data tests/e2e