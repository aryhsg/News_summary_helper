# 本機開發用的 compose 覆寫檔。
# docker-compose.yml 裡 db/redis/nginx 的 volume 路徑是寫死的 VPS 絕對路徑
# （/home/aryhsg/News_summary_helper/...、/var/www/nsh_frontend/...），
# 本機改成 named volume（db/redis）或指向本機實際路徑（nginx）。
#
# 搭配 Cloudflare Tunnel 架構（nsh-local tunnel）：web/line/nginx 現在
# 也透過 docker compose 跑成 container（不再用 `uvicorn --reload` 單獨
# 跑），這樣 nginx 才能用 docker 內部網路的 service name（web/line）
# 反向代理，而且 container 本身是 Linux，不會踩到 Windows ProactorEventLoop
# 的問題（Dockerfile 用的是 python:3.13-slim）。
#
# 用法：docker compose up -d --build
services:
  db:
    volumes:
      - nsh_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"

  redis:
    volumes:
      - nsh_redis_data:/data
    ports:
      - "6379:6379"

  nginx:
    # volumes/ports 用 !override 整個取代，不要用預設的合併行為——
    # base compose 裡還有一條指向 VPS 路徑（/home/aryhsg/...）的
    # /etc/nginx/ssl mount 跟 443 port，本機沒有那個路徑、也不需要那個
    # port（TLS 由 Cloudflare Tunnel 終止，本機 nginx 只用 80）。
    volumes: !override
      - ./infrastructure/news_database/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../News_summary_helper_frontend:/usr/share/nginx/html:ro
    ports: !override
      - "80:80"

  web:
    # .env 裡的 HOST/REDIS_URL/NEWS_API 是給「直接在 Windows host 上跑」
    # 用的（scrape_n_store.py、daily_truncate_tables.py 等仍然這樣跑）。
    # web/line 現在改成 docker container，container 裡的 localhost
    # 指的是 container 自己，連不到 db/redis container 或 host 上的
    # News_api，所以這裡覆蓋成 container 看得到的位址：db/redis 用
    # compose service name（docker 內部 DNS），News_api 用
    # host.docker.internal 連回 host。environment 的優先權比 env_file 高，
    # 不會動到 .env 本身。
    environment:
      HOST: db
      REDIS_URL: redis://redis:6379/0
      NEWS_API: http://host.docker.internal:8001/api/scrape-all-news/

  line:
    environment:
      HOST: db
      REDIS_URL: redis://redis:6379/0

  cron:
    environment:
      HOST: db
      REDIS_URL: redis://redis:6379/0
      NEWS_API: http://host.docker.internal:8001/api/scrape-all-news/

volumes:
  nsh_postgres_data:
  nsh_redis_data:
