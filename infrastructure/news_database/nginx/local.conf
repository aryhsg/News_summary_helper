# 本機開發用的 nginx 設定，給 Cloudflare Tunnel 架構用。
#
# 跟 default.conf（VPS 正式環境用）的差異：
# - 不做 TLS termination（沒有 ssl_certificate）。TLS 由 Cloudflare 在
#   邊緣節點終止，cloudflared 用純 HTTP 連到這裡，所以只監聽 80 port。
# - 前端靜態檔案的 root 改成本機的 News_summary_helper_frontend 目錄
#   （透過 docker-compose.override.yml 的 volume mount），不是 VPS 的
#   /var/www/nsh_frontend/。
# - index 改成 index.html（新版前端的進入點），不是舊的 main3.html。
#
# 跟 default.conf 相同的部分：/api/ 反向代理到 web container、
# newsbot 網域反向代理到 line container，這兩個路由邏輯完全比照正式環境。
server {
    listen 80;
    server_name newssummaryhelper.aryhsg.com;

    root /usr/share/nginx/html;
    index index.html;

    # 開發階段前端還在頻繁改動，nginx:stable-alpine 預設會幫靜態檔案加上
    # 4 小時的 Cache-Control，會讓改完程式碼卻看起來「沒生效」（其實是
    # 瀏覽器用舊快取）。本機開發先關掉快取，部署穩定後有需要再另外調整。
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name newsbot.aryhsg.com;

    location / {
        proxy_pass http://line:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
